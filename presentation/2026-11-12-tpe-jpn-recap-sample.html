<script>
const slides = Array.from(document.querySelectorAll('section'));
const previous = document.querySelector('#prev');
const next = document.querySelector('#next');
const page = document.querySelector('#page');
let current = 0;
function show(index) {
  current = Math.max(0, Math.min(index, slides.length - 1));
  slides.forEach((slide, i) => { slide.hidden = i !== current; });
  previous.disabled = current === 0;
  next.disabled = current === slides.length - 1;
  page.textContent = (current + 1) + ' / ' + slides.length;
}
previous.addEventListener('click', () => show(current - 1));
next.addEventListener('click', () => show(current + 1));
document.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const keys = {ArrowLeft:current-1,PageUp:current-1,ArrowRight:current+1,PageDown:current+1,Home:0,End:slides.length-1};
  if (Object.hasOwn(keys,event.key)) {
    event.preventDefault();
    show(keys[event.key]);
  }
});
show(0);
</script>
